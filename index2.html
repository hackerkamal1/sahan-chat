<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamal AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0f14;color:white}
.app{max-width:760px;margin:auto;min-height:100vh;padding:18px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;font-size:25px}
h1{font-size:25px;margin:0}.sub{color:#aeb8c5;font-size:14px;margin-top:4px}
.auth{background:#243447;color:white;border:1px solid #3a4d61;border-radius:12px;padding:10px 13px;font-weight:bold}
.auth.ok{background:#166534}.card{background:#121923;border:1px solid #263241;border-radius:18px;overflow:hidden}
#chat{min-height:420px;max-height:60vh;overflow-y:auto;padding:18px}
.msg{max-width:85%;padding:13px 15px;border-radius:15px;margin-bottom:12px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.bot{background:#1d2937;border-bottom-left-radius:4px}.user{background:#166534;margin-left:auto;border-bottom-right-radius:4px}
.typing{color:#aeb8c5;font-style:italic}.quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 15px 12px}
.quick button{background:#182330;color:white;border:1px solid #344456;border-radius:20px;padding:9px 13px}
.input-area{display:flex;gap:8px;padding:14px;border-top:1px solid #263241}
#input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #344456;background:#0d141d;color:white;font-size:16px;outline:none}
#input:focus{border-color:#22c55e}#send{border:0;border-radius:12px;padding:0 18px;background:#16a34a;color:white;font-weight:bold}
#send:disabled{opacity:.5}.notice{font-size:13px;color:#cbd5e1;padding:0 15px 12px}
footer{text-align:center;color:#7f8b99;font-size:12px;padding:15px 0 5px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><div class="logo">🤖</div><div><h1>Kamal AI</h1><div class="sub">Somali & English AI Chatbot</div></div></div>
<button id="authBtn" class="auth" onclick="signIn()">Bilow AI</button>
</header>
<div class="card">
<div id="chat"><div class="msg bot">Salaan! 👋 Waxaan ahay Kamal AI.
Waxaad ila hadli kartaa Soomaali ama English.
Taabo “Bilow AI” si aad u isticmaasho AI-ga.</div></div>
<div id="notice" class="notice">Taabo “Bilow AI” si aad u bilowdo.</div>
<div class="quick">
<button onclick="quickAsk('Sidee tahay?')">Sidee tahay?</button>
<button onclick="quickAsk('What can you do?')">What can you do?</button>
<button onclick="quickAsk('Yaa sameeyay Kamal AI?')">Yaa sameeyay?</button>
</div>
<div class="input-area">
<input id="input" type="text" placeholder="Qor su'aashaada..." autocomplete="off">
<button id="send" onclick="sendMessage()">Dir</button>
</div>
</div>
<footer>Kamal AI • Somali & English • Waxaa sameeyay Kamal, Osman & Ali</footer>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input");
const sendBtn=document.getElementById("send"),authBtn=document.getElementById("authBtn"),notice=document.getElementById("notice");
let conversation=[];

const systemPrompt=`You are Kamal AI, a helpful Somali and English AI assistant.
Answer in the same language the user uses. Understand Somali and English. Be friendly, clear and useful.
If asked who created, made, built, or developed Kamal AI, ALWAYS say:
Somali: "Kamal AI waxaa sameeyay Kamal, Osman, iyo Ali. 🤖🇸🇴"
English: "Kamal AI was created by Kamal, Osman, and Ali. 🇸🇴🤖"
Never replace these three names.`;

function addMessage(text,type){
 const d=document.createElement("div");d.className="msg "+type;d.textContent=text;chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;return d;
}
function setReady(){
 authBtn.textContent="✓ AI Diyaar";authBtn.classList.add("ok");
 notice.textContent="AI-ga waa diyaar. Hadda su'aashaada qor.";
}
async function signIn(){
 try{
  await puter.auth.signIn({attempt_temp_user_creation:true});
  setReady();addMessage("Waad diyaar tahay! 🤖 Hadda su'aashaada qor.","bot");input.focus();
 }catch(e){console.error(e);addMessage("Gelitaanka waa la joojiyay ama wuu fashilmay. Fadlan mar kale taabo Bilow AI.","bot");}
}
function checkAuth(){try{if(puter.auth.isSignedIn())setReady()}catch(e){}}

async function sendMessage(){
 const text=input.value.trim();if(!text)return;
 if(!puter.auth.isSignedIn()){
  addMessage("Fadlan marka hore taabo “Bilow AI” si AI-ga loo hawlgeliyo. 🤖","bot");return;
 }
 addMessage(text,"user");input.value="";sendBtn.disabled=true;
 const typing=addMessage("Kamal AI ayaa fikiraya... 🤔","bot typing");
 try{
  const response=await puter.ai.chat(
   [{role:"system",content:systemPrompt},...conversation,{role:"user",content:text}],
   {normalize:true}
  );
  let answer="";
  if(response&&response.message&&typeof response.message.content==="string") answer=response.message.content;
  else if(typeof response==="string") answer=response;
  else answer="Waan ka xumahay, jawaab sax ah lama helin. Fadlan isku day mar kale.";
  typing.remove();addMessage(answer,"bot");
  conversation.push({role:"user",content:text},{role:"assistant",content:answer});
  if(conversation.length>20)conversation=conversation.slice(-20);
 }catch(e){
  console.error(e);typing.remove();
  addMessage("Waan ka xumahay 😔 AI-ga hadda lama xiriiri karo. Fadlan mar kale isku day.","bot");
 }
 sendBtn.disabled=false;input.focus();
}
function quickAsk(text){input.value=text;sendMessage()}
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});
checkAuth();
</script>
</body>
</html>
