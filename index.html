<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamal AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0f14;
  color:white;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #222;
}

header h1{
  margin:0 0 8px;
  font-size:28px;
}

header p{
  margin:0;
  color:#aaa;
}

#chat{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message{
  margin:12px 0;
  padding:13px 16px;
  border-radius:15px;
  max-width:85%;
  line-height:1.5;
  white-space:pre-wrap;
}

.user{
  background:#2563eb;
  margin-left:auto;
}

.ai{
  background:#1b222c;
  margin-right:auto;
}

.input-area{
  display:flex;
  gap:8px;
  padding:15px;
  border-top:1px solid #222;
  background:#0b0f14;
}

input{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:1px solid #333;
  background:#151a21;
  color:white;
  font-size:16px;
  outline:none;
}

button{
  border:0;
  border-radius:12px;
  padding:0 20px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

.quick{
  display:flex;
  gap:8px;
  padding:0 15px 15px;
  overflow-x:auto;
}

.quick button{
  padding:10px 14px;
  white-space:nowrap;
}

footer{
  text-align:center;
  padding:12px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>🤖 Kamal AI 🇸🇴</h1>
  <p>Somali & English AI Chatbot</p>
</header>

<div id="chat"></div>

<div class="quick">
  <button onclick="quickAsk('Sidee tahay?')">Sidee tahay?</button>
  <button onclick="quickAsk('What can you do?')">What can you do?</button>
  <button onclick="quickAsk('Yaa sameeyay Kamal AI?')">Yaa sameeyay?</button>
</div>

<div class="input-area">
  <input
    id="input"
    type="text"
    placeholder="Qor su'aashaada..."
    onkeydown="if(event.key==='Enter') sendMessage()"
  >
  <button id="send" onclick="sendMessage()">Dir</button>
</div>

<footer>
  Kamal AI • Waxaa sameeyay Kamal, Osman & Ali 🇸🇴
</footer>

</div>

<script>
const WORKER_URL =
  "https://kamal-ai.kamaalosmanali.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");

let messages = [];

function addMessage(text, type){
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function quickAsk(text){
  input.value = text;
  sendMessage();
}

async function sendMessage(){
  const text = input.value.trim();

  if(!text) return;

  addMessage(text, "user");

  messages.push({
    role:"user",
    content:text
  });

  input.value = "";
  send.disabled = true;

  addMessage("Kamal AI ayaa fikiraya... 🤔", "ai");

  try{
    const response = await fetch(WORKER_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        messages:messages
      })
    });

    const data = await response.json();

    const aiMessages =
      document.querySelectorAll(".message.ai");

    const thinking =
      aiMessages[aiMessages.length - 1];

    if(data.reply){
      thinking.textContent = data.reply;

      messages.push({
        role:"assistant",
        content:data.reply
      });
    }else{
      thinking.textContent =
        "Waan ka xumahay 😔 AI-ga jawaab ma soo celin.";
    }

  }catch(error){

    const aiMessages =
      document.querySelectorAll(".message.ai");

    const thinking =
      aiMessages[aiMessages.length - 1];

    thinking.textContent =
      "Khalad ayaa dhacay. Fadlan mar kale isku day. 😔";
  }

  send.disabled = false;
  input.focus();
}

addMessage(
  "Salaan! 👋 Waxaan ahay Kamal AI. Waxaad igula hadli kartaa Soomaali ama English. Maxaan kuu qaban karaa?",
  "ai"
);
</script>

</body>
</html>
