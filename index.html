      
<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamal AI</title>

<script src="https://js.puter.com/v2/"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0f14;
  color:white;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:18px;
  background:#111820;
  border-bottom:1px solid #26313d;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#22c55e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

h1{
  font-size:25px;
  margin:0;
}

.sub{
  color:#aeb8c5;
  margin-top:4px;
}

#chat{
  flex:1;
  min-height:420px;
  max-height:70vh;
  overflow-y:auto;
  padding:18px;
}

.msg{
  max-width:85%;
  padding:13px 15px;
  margin:10px 0;
  border-radius:14px;
  line-height:1.5;
  white-space:pre-wrap;
}

.bot{
  background:#1d2937;
  border-bottom-left-radius:4px;
}

.user{
  background:#166534;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.typing{
  color:#aeb8c5;
  font-style:italic;
}

.quick{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:10px 14px;
}

.quick button{
  background:#182330;
  color:white;
  border:1px solid #344454;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
}

.input-area{
  display:flex;
  gap:8px;
  padding:14px;
  border-top:1px solid #26313d;
  background:#111820;
}

#input{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:10px;
  border:1px solid #344454;
  background:#0b0f14;
  color:white;
  font-size:16px;
}

#input:focus{
  outline:none;
  border-color:#22c55e;
}

#send{
  border:0;
  border-radius:10px;
  padding:0 18px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:12px;
  color:#7f8b99;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">🤖</div>
    <div>
      <h1>Kamal AI</h1>
      <div class="sub">Somali & English AI chatbot</div>
    </div>
  </div>
</header>

<div id="chat">
  <div class="msg bot">
    Salaan! 👋 Waxaan ahay Kamal AI.
    Waxaad igula hadli kartaa Soomaali ama English.
    Maxaan kuu qaban karaa?
  </div>
</div>

<div class="quick">
  <button onclick="quickAsk('Sidee tahay?')">Sidee tahay?</button>
  <button onclick="quickAsk('What can you do?')">What can you do?</button>
  <button onclick="quickAsk('Yaa sameeyay Kamal AI?')">Yaa sameeyay?</button>
</div>

<div class="input-area">
  <input id="input" type="text" placeholder="Qor su'aashaada..." autocomplete="off">
  <button id="send" onclick="send()">Dir</button>
</div>

<footer>
  Kamal AI • Somali & English • Waxaa sameeyay Kamal, Osman & Ali
</footer>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");

const messages = [
  {
    role: "system",
    content: `
You are Kamal AI, a helpful Somali and English AI assistant.

IMPORTANT RULES:
1. Answer the user in the same language they use.
2. You can understand and answer Somali and English.
3. Be helpful, friendly, clear and concise.
4. Do not claim to be a human.
5. If the user asks who created, made, built, or developed Kamal AI, ALWAYS answer:

Somali:
"Kamal AI waxaa sameeyay Kamal, Osman, iyo Ali. 🤖🇸🇴"

English:
"Kamal AI was created by Kamal, Osman, and Ali. 🇸🇴🤖"

Do not change these three creator names.
`
  }
];

function addMessage(text, type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function askAI(question){

  messages.push({
    role:"user",
    content:question
  });

  const typing = document.createElement("div");
  typing.className = "msg bot typing";
  typing.textContent = "Kamal AI wuu fikirayaa... 🤔";
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try{

    const result = await puter.ai.chat(messages);

    typing.remove();

    let answer = "";

    if(result && result.message && result.message.content){
      answer = result.message.content;
    }else if(typeof result === "string"){
      answer = result;
    }else{
      answer = JSON.stringify(result);
    }

    messages.push({
      role:"assistant",
      content:answer
    });

    addMessage(answer,"bot");

  }catch(error){

    typing.remove();

    addMessage(
      "Raalli ahow 😔 AI-ga hadda lama xiriiri karo. Fadlan mar kale isku day.",
      "bot"
    );

    console.error(error);
  }
}

async function send(){

  const question = input.value.trim();

  if(!question) return;

  addMessage(question,"user");

  input.value="";
  sendButton.disabled=true;

  await askAI(question);

  sendButton.disabled=false;
  input.focus();
}

function quickAsk(question){
  input.value=question;
  send();
}

input.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    send();
  }
});
</script>

</body>
</html>
