<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamal AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff;min-height:100vh;display:flex;justify-content:center}.app{width:100%;max-width:760px;min-height:100vh;display:flex;flex-direction:column;background:#111827}header{padding:18px 20px;background:#151d31;border-bottom:1px solid #29344d;text-align:center}.logo{font-size:30px}h1{margin:4px 0;font-size:25px}.sub{color:#aab4c8;font-size:14px}#chat{flex:1;padding:18px;overflow-y:auto}.msg{max-width:86%;padding:12px 15px;margin:10px 0;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}.bot{background:#202b42;border-bottom-left-radius:5px;margin-right:auto}.user{background:#2563eb;border-bottom-right-radius:5px;margin-left:auto}.quick{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto}.quick button{white-space:nowrap;border:1px solid #34415d;background:#192238;color:#fff;border-radius:20px;padding:9px 13px}.input-area{display:flex;gap:8px;padding:12px;background:#151d31;border-top:1px solid #29344d}#input{flex:1;min-width:0;border:1px solid #3a4661;border-radius:24px;padding:13px 16px;background:#0d1425;color:#fff;outline:none;font-size:16px}#send{border:0;border-radius:24px;padding:0 19px;background:#2563eb;color:#fff;font-weight:bold}#send:disabled{opacity:.6}footer{text-align:center;color:#7f8ba3;font-size:12px;padding:8px;background:#0d1425}@media(max-width:520px){.msg{max-width:92%}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🤖</div><h1>Kamal AI</h1><div class="sub">Somali & English AI</div></header>
<main id="chat"><div class="msg bot">Salaan! 👋 Waxaan ahay Kamal AI. Waxaad igula hadli kartaa Soomaali ama English. Maxaan kuu qaban karaa?</div></main>
<div class="quick">
<button onclick="quickAsk('Sidee tahay?')">Sidee tahay?</button>
<button onclick="quickAsk('What can you do?')">What can you do?</button>
<button onclick="quickAsk('Yaa sameeyay Kamal AI?')">Yaa sameeyay?</button>
</div>
<div class="input-area"><input id="input" placeholder="Qor su'aashaada..." autocomplete="off"><button id="send" onclick="send()">Dir</button></div>
<footer>Kamal AI • Somali & English • Waxaa sameeyay Kamal, Osman & Ali</footer>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),sendBtn=document.getElementById("send");
const systemPrompt=`You are Kamal AI, a helpful bilingual Somali and English chatbot.
Answer directly and naturally. If the user writes Somali, answer Somali. If English, answer English.
Help with general questions, explanations, writing, coding, learning, translation and everyday tasks.
IMPORTANT CREATOR RULE: If asked who made, created, built, developed or owns Kamal AI, always say:
Somali: "Kamal AI waxaa sameeyay Kamal, Osman, iyo Ali. 🤖🇸🇴"
English: "Kamal AI was created by Kamal, Osman, and Ali. 🇸🇴🤖"
Never change those three names.`;

function addMessage(text,type){const d=document.createElement("div");d.className="msg "+type;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function quickAsk(t){input.value=t;send()}
async function send(){
 const q=input.value.trim(); if(!q||sendBtn.disabled)return;
 addMessage(q,"user");input.value="";sendBtn.disabled=true;
 const typing=addMessage("Kamal AI wuu fikirayaa…","bot");
 try{
   if(/(yaa|who|sameeyay|sameyey|abuuray|created|creator|made|built|developer|developed|owner).*(kamal|chatbot|ai)|(kamal ai).*(yaa|who|sameeyay|created|made|built|developer|owner)/i.test(q)){
     typing.remove();
     addMessage(/who|created|made|built|developer|owner|developed/i.test(q)?"Kamal AI was created by Kamal, Osman, and Ali. 🇸🇴🤖":"Kamal AI waxaa sameeyay Kamal, Osman, iyo Ali. 🤖🇸🇴","bot");
   }else{
     const r=await puter.ai.chat([{role:"system",content:systemPrompt},{role:"user",content:q}]);
     typing.remove();
     let text=typeof r==="string"?r:(r?.message?.content||r?.text||String(r??""));
     addMessage(text||"Jawaab lama helin. Fadlan isku day mar kale.","bot");
   }
 }catch(e){
   typing.remove();
   addMessage("Raalli ahow, AI-ga hadda jawaab kama soo celin. Hubi internet-kaaga oo isku day mar kale. Haddii Puter kuu weydiiyo inaad gasho, raac tallaabadaas.","bot");
   console.error(e);
 }finally{sendBtn.disabled=false;input.focus()}
}
input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
</script>
</body>
</html>
